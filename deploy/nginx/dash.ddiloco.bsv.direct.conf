# Private DiLoCo dashboard/control (for jonasal/nginx-certbot)
# Copy to your nginx user_conf.d directory.
# Requires diloco-agent container on the same docker network (proxy-net).
# WARNING: agent can launch processes on the host/container. Protect this endpoint.
#
# Auth:
# - diloco-agent enforces auth when AGENT_TOKEN is set (deploy/.env): browser login via
#   HTTP Basic (user: any, password: AGENT_TOKEN) or API header X-DiLoCo-Token / ?token=.
# - Recommended: add nginx auth_basic and/or IP/VPN allowlist as an extra layer.

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name dash.ddiloco.bsv.direct;

    # Docker embedded DNS: evita fallos de arranque/reload si el contenedor upstream no está disponible
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate         /etc/letsencrypt/live/dash.ddiloco.bsv.direct/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/dash.ddiloco.bsv.direct/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/dash.ddiloco.bsv.direct/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Extra layer (recommended): nginx HTTP basic auth
    #   htpasswd -nbB admin 'strong-password' > /path/to/nginx/user_conf.d/.htpasswd-ddiloco-dash
    # auth_basic "DiLoCo Private Dashboard";
    # auth_basic_user_file /etc/nginx/user_conf.d/.htpasswd-ddiloco-dash;

    # Extra layer (recommended): restrict by IP/VPN (e.g. Tailscale)
    # allow 100.64.0.0/10;
    # allow 127.0.0.1;
    # deny all;

    client_max_body_size 10m;

    # Página HTML amigable cuando el contenedor/proxy no está disponible (p.ej. reinicio de Docker)
    error_page 502 503 504 =503 /__diloco_unavailable.html;
    location = /__diloco_unavailable.html {
        internal;
        root /var/www/didiloco;
        try_files /503.html =503;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    location / {
        set $agent_upstream http://diloco-agent:8765;
        proxy_pass $agent_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_intercept_errors on;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name dash.ddiloco.bsv.direct;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
