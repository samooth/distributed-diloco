# Public DiLoCo status page + sanitized API (for jonasal/nginx-certbot)
# Copy to your nginx user_conf.d directory (mounted as /etc/nginx/user_conf.d in nginx container).
# Requires diloco-coordinator container on the same docker network (proxy-net).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ddiloco.bsv.direct;

    ssl_certificate         /etc/letsencrypt/live/ddiloco.bsv.direct/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/ddiloco.bsv.direct/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/ddiloco.bsv.direct/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    # Static public page (copy web/public/* to /var/www/ddiloco.bsv.direct on the VPS host)
    root /var/www/ddiloco.bsv.direct;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public, sanitized status only. Do NOT proxy other /v1/* endpoints.
    location = /api/status {
        proxy_pass http://diloco-coordinator:8095/v1/public/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name ddiloco.bsv.direct;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
