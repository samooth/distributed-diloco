# didiloco.bsv.direct - Public page + sanitized status API
# Compatible with jonasal/nginx-certbot. Place in your nginx user_conf.d (host path mounted into container).
#
# - Public static files: /var/www/didiloco (host), served directly by nginx (works even if DiLoCo containers are down)
# - /api/status -> proxied to diloco-coordinator:8095/v1/public/status (returns 502 gracefully if container is down)
# - Uses variable + resolver so nginx can start/reload even when upstream containers are not running.
#
# NOTE: SSL certificate paths preserved as provided. Verify they match the issued cert for this domain.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Docker embedded DNS: allows nginx to start even if upstream containers are down
    resolver 127.0.0.11 valid=10s ipv6=off;

    server_name didiloco.bsv.direct;
    root /var/www/didiloco;
    index index.html index.htm;

    # Load the certificate files (verify paths/cert name match your setup).
    ssl_certificate         /etc/letsencrypt/live/didiloco.direct/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/didiloco.direct/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/didiloco.direct/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Public static site (no dependency on app containers)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Public, sanitized status only. NEVER proxy private /v1/* endpoints here.
    location = /api/status {
        set $coord_upstream http://diloco-coordinator:8095;
        proxy_pass $coord_upstream/v1/public/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @status_unavailable;
    }

    location @status_unavailable {
        default_type application/json;
        return 503 '{"ok":false,"finished":false,"workers_active":0,"error":"coordinator_unavailable"}';
    }

    # Private dashboard (optional, same domain). PROTECT before enabling.
    # diloco-agent enforces auth when AGENT_TOKEN is set (HTTP Basic: password = AGENT_TOKEN),
    # but add nginx auth_basic and/or IP/VPN allowlist as an extra layer.
    # location = /__dashboard_unavailable.html {
    #     internal;
    #     root /var/www/didiloco;
    #     try_files /503.html =503;
    #     default_type text/html;
    #     add_header Cache-Control "no-store" always;
    # }
    # location /dashboard/ {
    #     # auth_basic "DiLoCo Private Dashboard";
    #     # auth_basic_user_file /etc/nginx/user_conf.d/.htpasswd-didiloco;
    #     # allow 100.64.0.0/10; deny all; # Tailscale/VPN example
    #     set $agent_upstream http://diloco-agent:8765;
    #     rewrite ^/dashboard/(.*)$ /$1 break;
    #     proxy_pass $agent_upstream;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Authorization $http_authorization; # pass agent Basic auth if not consumed by nginx
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 300s;
    #     proxy_intercept_errors on;
    #     error_page 502 503 504 =503 /__dashboard_unavailable.html;
    # }

    location ~ /\. {
        deny all;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name didiloco.bsv.direct;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
