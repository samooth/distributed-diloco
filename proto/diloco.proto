syntax = "proto3";

package diloco;

service Coordinator {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetState(StateRequest) returns (StateResponse);
  rpc GetStateMeta(StateRequest) returns (StateMetaResponse);
  rpc GetStateChunk(StateChunkRequest) returns (StateChunkResponse);
  rpc Submit(SubmitRequest) returns (StateResponse);
  rpc Leave(LeaveRequest) returns (LeaveResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

message RegisterRequest {
  string node_id = 1;
  string config_hash = 2;
  string base_hash = 3;
  string node_pubkey = 4;
  string node_sig = 5;
  string sig_alg = 6;
  string run_id = 7;
}

message RegisterResponse {
  bool ok = 1;
  string node_id = 2;
  int64 round = 3;
  int64 global_step = 4;
  int32 h = 5;
  int64 max_rounds = 6;
  bool done = 7;
  string state_hash = 8;
  repeated string registered = 9;
}

message HeartbeatRequest {
  string node_id = 1;
}

message HeartbeatResponse {
  bool ok = 1;
  int64 round = 2;
  int32 pending_updates = 3;
}

message StateRequest {
  string node_id = 1;
}

message StateResponse {
  bytes payload = 1;
}

message StateMetaResponse {
  string json = 1;
}

message StateChunkRequest {
  string node_id = 1;
  int64 offset = 2;
  int64 length = 3;
}

message StateChunkResponse {
  bytes data = 1;
  int64 offset = 2;
  int64 total_size = 3;
  string blob_hash = 4;
  string state_hash = 5;
  int64 round = 6;
  bool eof = 7;
}

message SubmitRequest {
  bytes payload = 1;
}

message LeaveRequest {
  string node_id = 1;
}

message LeaveResponse {
  bool ok = 1;
  bool removed = 2;
}

message HealthRequest {}

message HealthResponse {
  string json = 1;
}

message StatusRequest {}

message StatusResponse {
  string json = 1;
}
