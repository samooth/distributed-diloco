[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diloco-lab"
version = "0.1.0"
description = "DiLoCo P0/P1: adapter synchronization, localhost coordinator and checkpoints"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.8,<3",
  "safetensors>=0.5",
]

[project.optional-dependencies]
hf = [
  "transformers>=4.57,<6",
  "peft>=0.17,<0.22",
  "bitsandbytes>=0.45",
  "accelerate>=1.0",
]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["diloco"]

[tool.pytest.ini_options]
testpaths = ["tests"]
